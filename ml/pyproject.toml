[project]
name = "stock-ml"
version = "0.1.0"
description = "Price Direction Classifier — Random Forest ML module for Stock Streaming Analytics"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "joblib>=1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
