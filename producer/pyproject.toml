[project]
name = "stock-producer"
version = "0.1.0"
description = "Kafka producer that streams real-time stock market data"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
